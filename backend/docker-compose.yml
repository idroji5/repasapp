services:
  db:
    image: postgres:16-alpine
    container_name: repasapp-db
    environment:
      POSTGRES_USER: repasapp
      POSTGRES_PASSWORD: repasapp
      POSTGRES_DB: repasapp
    ports:
      - "5433:5432"
    volumes:
      - repasapp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repasapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repasapp-pgdata:
